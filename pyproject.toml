[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "socio-ai"
version = "1.0.0"
description = "Plataforma inteligente de auditoria financiera con IA"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "SocioAI Team" }]
keywords = ["auditoria", "finanzas", "IA", "LLM"]

# Nota: el backend FastAPI instala desde requirements.txt / requirements.api.txt.
# Esta lista cubre ademas los modulos RAG e ingesta de documentos (chromadb,
# sentence-transformers, pypdf), que se importan de forma diferida.
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "PyJWT>=2.9.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "pyyaml>=6.0",
    "openai>=1.0.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "pypdf>=3.17.0",
    "python-docx>=1.1.2",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "ipython>=8.0.0",
]

[tool.setuptools.packages.find]
include = ["backend*", "core*", "domain*", "analysis*", "llm*", "infra*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["domain", "analysis", "llm", "infra", "backend"]
omit = [
    "*/tests/*",
    "*/migrations/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 60
