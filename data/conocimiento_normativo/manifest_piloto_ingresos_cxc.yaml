    review_status: official_sources_identified
    accounting_framework:
      resolution: SCVS-INC-DNCDN-2019-0009
      issued: 2019-08-16
      effective_from: 2019-09-13
      effective_rule: vigente desde su publicacion segun articulo 14
      registry: Registro Oficial No. 39 de 2019-09-13
      official_registry_page: https://www.registroficial.gob.ec/registro-oficial-no-39-13/
