      locators: articulos 1 a 14, paginas 34 a 36
      sme_definition:
        rule: deben cumplirse conjuntamente las tres condiciones del articulo 1
        assets: inferior a USD 4000000
        gross_annual_sales: hasta USD 5000000
        employees: menos de 200, promedio anual ponderado
      full_ifrs_exceptions:
        - inscripcion en Catastro Publico del Mercado de Valores
        - constituyente u originador de fideicomiso mercantil
        - participantes del sector seguros indicados en el articulo 3
