# Riesgos típicos por área L/S
# Estructura: codigo_ls -> { nombre, riesgos: [id, descripcion, nivel, afirmacion] }
# nivel: alto | medio | bajo
#
# ESTADO: borrador generado por IA (jun-2026), pendiente de validación por el socio.
# Revisar cada riesgo y ajustar al criterio de la firma antes de usar en encargos.

"140":
  nombre: "Efectivo y Equivalentes a Efectivo"
  riesgos:
    - id: "R-EFE-01"
      descripcion: "Partidas conciliatorias antiguas sin depurar que ocultan faltantes o sobregiros no registrados."
      nivel: "alto"
      afirmacion: "Integridad"
    - id: "R-EFE-02"
      descripcion: "Cuentas bancarias no registradas en contabilidad (cuentas a nombre de la compañía abiertas sin conocimiento del contador)."
      nivel: "alto"
      afirmacion: "Integridad"
    - id: "R-EFE-03"
      descripcion: "Manipulación del corte: depósitos en tránsito ficticios para inflar el saldo al cierre (kiting)."
      nivel: "medio"
      afirmacion: "Existencia"
    - id: "R-EFE-04"
      descripcion: "Efectivo restringido o pignorado presentado como disponible (garantías bancarias, cuentas embargadas)."
      nivel: "medio"
      afirmacion: "Derechos"
    - id: "R-EFE-05"
      descripcion: "Caja chica usada para gastos sin soporte o fraccionados para evadir niveles de aprobación."
      nivel: "bajo"
      afirmacion: "Existencia"

"130.1":
  nombre: "Cuentas por Cobrar Corrientes"
  riesgos:
    - id: "R-CXC-01"
      descripcion: "Provisión de incobrables insuficiente frente a la antigüedad real de la cartera (la gerencia evita reconocer el gasto)."
      nivel: "alto"
      afirmacion: "Valuacion"
    - id: "R-CXC-02"
      descripcion: "Ventas ficticias o anticipadas cerca del cierre para cumplir metas, revertidas en enero (corte)."
      nivel: "alto"
      afirmacion: "Existencia"
    - id: "R-CXC-03"
      descripcion: "Saldos con partes relacionadas mezclados en cartera comercial, sin interés ni plazo definido."
      nivel: "alto"
      afirmacion: "Presentacion"
    - id: "R-CXC-04"
      descripcion: "Notas de crédito posteriores al cierre que anulan ventas del período auditado."
      nivel: "medio"
      afirmacion: "Corte"
    - id: "R-CXC-05"
      descripcion: "Saldos acreedores en cartera (anticipos de clientes) presentados neteados en lugar de pasivo."
      nivel: "medio"
      afirmacion: "Presentacion"

"110":
  nombre: "Inventarios"
  riesgos:
    - id: "R-INV-01"
      descripcion: "Inventario obsoleto, dañado o de lento movimiento sin provisión por deterioro (VNR menor al costo)."
      nivel: "alto"
      afirmacion: "Valuacion"
    - id: "R-INV-02"
      descripcion: "Diferencias entre kárdex y toma física no investigadas ni ajustadas."
      nivel: "alto"
      afirmacion: "Existencia"
    - id: "R-INV-03"
      descripcion: "Corte incorrecto: mercadería en tránsito o en consignación incluida/excluida según convenga al resultado."
      nivel: "medio"
      afirmacion: "Corte"
    - id: "R-INV-04"
      descripcion: "Costeo inconsistente entre períodos (cambio de promedio a FIFO sin revelación ni recálculo)."
      nivel: "medio"
      afirmacion: "Valuacion"

"14":
  nombre: "Inversiones No Corrientes"
  riesgos:
    - id: "R-INF-01"
      descripcion: "Inversiones en subsidiarias o asociadas sin ajustar por método de participación o deterioro pese a pérdidas recurrentes de la participada."
      nivel: "alto"
      afirmacion: "Valuacion"
    - id: "R-INF-02"
      descripcion: "Clasificación incorrecta corriente/no corriente para mejorar indicadores de liquidez."
      nivel: "medio"
      afirmacion: "Presentacion"
    - id: "R-INF-03"
      descripcion: "Títulos custodiados por terceros sin confirmación externa de existencia y titularidad."
      nivel: "medio"
      afirmacion: "Existencia"

"1":
  nombre: "Propiedad Planta y Equipo"
  riesgos:
    - id: "R-PPE-01"
      descripcion: "Vidas útiles y valores residuales no revisados en años; depreciación que no refleja el uso real del activo."
      nivel: "alto"
      afirmacion: "Valuacion"
    - id: "R-PPE-02"
      descripcion: "Deterioros registrados (u omitidos) sin análisis económico: cuestionar la lógica del negocio antes de aceptar el deterioro contable."
      nivel: "alto"
      afirmacion: "Valuacion"
    - id: "R-PPE-03"
      descripcion: "Gastos de mantenimiento capitalizados (o mejoras enviadas al gasto) para manejar el resultado."
      nivel: "medio"
      afirmacion: "Valuacion"
    - id: "R-PPE-04"
      descripcion: "Activos totalmente depreciados aún en uso, o activos dados de baja físicamente que siguen en libros."
      nivel: "medio"
      afirmacion: "Existencia"
    - id: "R-PPE-05"
      descripcion: "Revaluaciones sin perito independiente o sin contabilizar el pasivo por impuesto diferido asociado."
      nivel: "medio"
      afirmacion: "Valuacion"

"425":
  nombre: "Cuentas por Pagar"
  riesgos:
    - id: "R-CXP-01"
      descripcion: "Pasivos omitidos: facturas de proveedores recibidas después del cierre por bienes/servicios del período auditado."
      nivel: "alto"
      afirmacion: "Integridad"
    - id: "R-CXP-02"
      descripcion: "Préstamos de accionistas o partes relacionadas sin documentación, sin interés o usados para capitalizar pérdidas."
      nivel: "alto"
      afirmacion: "Presentacion"
    - id: "R-CXP-03"
      descripcion: "Saldos antiguos con proveedores inactivos que deberían darse de baja o investigarse (posibles pasivos ficticios)."
      nivel: "medio"
      afirmacion: "Existencia"

"200":
  nombre: "Patrimonio"
  riesgos:
    - id: "R-PAT-01"
      descripcion: "Aumentos de capital no inscritos o aportes para futuras capitalizaciones presentados como patrimonio cuando son pasivo."
      nivel: "alto"
      afirmacion: "Presentacion"
    - id: "R-PAT-02"
      descripcion: "Causal de disolución por pérdidas acumuladas no advertida ni revelada (verificar umbrales societarios vigentes)."
      nivel: "alto"
      afirmacion: "Presentacion"
    - id: "R-PAT-03"
      descripcion: "Distribución de dividendos sin utilidades suficientes o sin las reservas legales requeridas."
      nivel: "medio"
      afirmacion: "Exactitud"
    - id: "R-PAT-04"
      descripcion: "Movimientos patrimoniales sin actas de junta que los respalden."
      nivel: "medio"
      afirmacion: "Ocurrencia"

"1500":
  nombre: "Ingresos"
  riesgos:
    - id: "R-ING-01"
      descripcion: "Reconocimiento de ingresos antes de cumplir la obligación de desempeño (riesgo presunto de fraude según NIA 240)."
      nivel: "alto"
      afirmacion: "Ocurrencia"
    - id: "R-ING-02"
      descripcion: "Ventas no facturadas o facturación fuera del sistema (integridad de ingresos en negocios con efectivo)."
      nivel: "alto"
      afirmacion: "Integridad"
    - id: "R-ING-03"
      descripcion: "Corte de ingresos manipulado en los últimos días del período para alcanzar metas o reducir impuestos."
      nivel: "alto"
      afirmacion: "Corte"
    - id: "R-ING-04"
      descripcion: "Ingresos diferidos (anticipos, contratos plurianuales) reconocidos de inmediato en resultados."
      nivel: "medio"
      afirmacion: "Exactitud"

"136":
  nombre: "Activos por Impuestos Corrientes"
  riesgos:
    - id: "R-IMP-01"
      descripcion: "Crédito tributario acumulado sin análisis de recuperabilidad (saldos que la compañía nunca podrá compensar o pedir en devolución)."
      nivel: "alto"
      afirmacion: "Valuacion"
    - id: "R-IMP-02"
      descripcion: "Diferencias entre declaraciones fiscales y libros contables no conciliadas."
      nivel: "medio"
      afirmacion: "Exactitud"
    - id: "R-IMP-03"
      descripcion: "Retenciones registradas sin los comprobantes que las respalden."
      nivel: "medio"
      afirmacion: "Existencia"

"1900":
  nombre: "Gasto Impuesto a la Renta"
  riesgos:
    - id: "R-GIR-01"
      descripcion: "Conciliación tributaria con gastos no deducibles omitidos para reducir la base imponible."
      nivel: "alto"
      afirmacion: "Exactitud"
    - id: "R-GIR-02"
      descripcion: "Impuesto diferido no reconocido o mal calculado sobre diferencias temporarias (provisiones, depreciaciones, pérdidas amortizables)."
      nivel: "medio"
      afirmacion: "Integridad"
    - id: "R-GIR-03"
      descripcion: "Contingencias fiscales (glosas, determinaciones en curso) no provisionadas ni reveladas."
      nivel: "alto"
      afirmacion: "Integridad"
